name: DB deploy (migrations)

# Applies pending SQL migrations from supabase/migrations/ to the Supabase
# project using the official CLI. `supabase db push` only applies versions that
# are missing from the remote history table, so re-runs are safe no-ops.
#
# ACTIVATION (one-time, by a maintainer): add the repository secrets
#   SUPABASE_ACCESS_TOKEN  — personal access token (https://supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF   — the project ref (Settings > General)
#   SUPABASE_DB_PASSWORD   — the database password (Settings > Database)
# Until the secrets are set the job is a no-op (it skips, green), so it never
# blocks merges before CI is wired. Issue #45 tracks the CI wiring.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-deploy.yml"
  workflow_dispatch: {}

jobs:
  db-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        id: gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Supabase secrets not set — skipping db push (no-op)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.gate.outputs.enabled == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        if: steps.gate.outputs.enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push
