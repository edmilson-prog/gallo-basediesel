name: DB types drift check

# Regenerates src/types/supabase.generated.ts from the live schema and fails if
# it drifts from the committed file — i.e. someone changed the schema without
# regenerating the types. Read-only against the project (uses the management
# API, no DB connection).
#
# ACTIVATION (one-time, by a maintainer): add the repository secrets
#   SUPABASE_ACCESS_TOKEN  — personal access token
#   SUPABASE_PROJECT_REF   — the project ref
# Until the secrets are set the job is a no-op (it skips, green). Issue #45
# tracks the CI wiring.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "src/types/supabase.generated.ts"
      - ".github/workflows/gen-types.yml"
  workflow_dispatch: {}

jobs:
  types-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        id: gate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Supabase secrets not set — skipping types drift check (no-op)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.gate.outputs.enabled == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate types and diff
        if: steps.gate.outputs.enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          {
            echo "// AUTO-GENERATED by \`supabase gen types\` (via MCP) — DO NOT EDIT."
            echo "// Regenerate after schema migrations: see .github/workflows/gen-types.yml"
            supabase gen types typescript --project-id "${{ secrets.SUPABASE_PROJECT_REF }}" --schema public
          } > /tmp/supabase.generated.ts
          if ! diff -q /tmp/supabase.generated.ts src/types/supabase.generated.ts; then
            echo "::error::src/types/supabase.generated.ts is out of date with the live schema."
            echo "Regenerate it (supabase gen types typescript --schema public) and commit."
            diff /tmp/supabase.generated.ts src/types/supabase.generated.ts || true
            exit 1
          fi
          echo "Types are in sync."
