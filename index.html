    <!-- PWA — two installable apps share this single index.html: the external
         seller app at /pwa (PRD-070) and the atendimento app at /atendimento.
         The defaults below are the seller's; the script that follows switches
         them for /atendimento BEFORE the first paint. -->
    <link rel="manifest" href="/manifest.webmanifest" id="app-manifest" />
    <meta name="theme-color" content="#16a34a" id="app-theme-color" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GALLO Vendedor" id="app-ios-title" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      // Pick the manifest for the app being opened, before the first paint.
      //
      // The browser decides whether a page is installable AT LOAD, against the
      // manifest linked at that moment. Swapping the href later (from React,
      // once the route mounts) is too late: `beforeinstallprompt` never fires,
      // so no install banner appears — and worse, "add to home screen" from the
      // browser menu would install the SELLER app, because the seller manifest
      // (scope /pwa) is what the page still declares.
      //
      // Same discipline as the anti-FOUC theme script below: decide in the head,
      // not after hydration.
      (function () {
        try {
          if (!window.location.pathname.startsWith("/atendimento")) return;
          document.getElementById("app-manifest").setAttribute("href", "/atendimento.webmanifest");
          document.getElementById("app-theme-color").setAttribute("content", "#141011");
          document.getElementById("app-ios-title").setAttribute("content", "GALLO Atendimento");
        } catch (_e) {
          // Leave the seller defaults in place — the app still works, it just
          // is not installable from /atendimento.
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Saira+Condensed:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <script>
      // Anti-FOUC: aplica data-theme/data-mode + classe .dark antes do primeiro paint.
      (function () {
        try {
          var html = document.documentElement;
          var theme = localStorage.getItem("gallo-theme");
          if (!["diesel", "parts", "service", "industrial"].includes(theme)) theme = "diesel";
          var mode = localStorage.getItem("gallo-mode");
          if (!["light", "dark", "auto"].includes(mode)) mode = "dark";
          var resolved = mode;
          if (mode === "auto") {
            resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          html.setAttribute("data-theme", theme);
          html.setAttribute("data-mode", resolved);
          if (resolved === "dark") html.classList.add("dark");
        } catch (_e) {
          document.documentElement.setAttribute("data-theme", "diesel");
          document.documentElement.setAttribute("data-mode", "dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
